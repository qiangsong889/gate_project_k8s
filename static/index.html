<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>笔记问答</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f6; color: #252723; font-family: system-ui, sans-serif; }
    main { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .hint { color: #66685f; margin: 0 0 28px; line-height: 1.6; }
    form { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; padding: 13px; border: 1px solid #aaa; border-radius: 6px; background: white; font: inherit; }
    button { padding: 12px 22px; border: 0; border-radius: 6px; background: #285143; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #668e7e; outline-offset: 3px; }
    #status { min-height: 24px; font-size: 14px; color: #66685f; }
    #status.error { color: #a52b25; }
    article { border-top: 1px solid #deded5; padding: 22px 0; }
    h2 { font-size: 16px; margin: 0 0 12px; overflow-wrap: anywhere; }
    .answer { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
    .tool-step { margin: 0 0 8px; color: #66685f; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    @media (max-width: 480px) { main { margin: 28px auto; padding: 0 16px; } button { padding-inline: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>笔记问答</h1>
    <p class="hint">问一个问题，也可以接着追问。</p>
    <section id="messages" aria-label="对话记录"></section>
    <form id="chat-form">
      <input id="message" aria-label="你的问题" placeholder="例如：etcd 是干什么的？" autocomplete="off" required>
      <button id="send" type="submit">发送</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const button = document.querySelector('#send');
    const status = document.querySelector('#status');
    const messages = document.querySelector('#messages');
    let sessionId = null;
    let sending = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question || sending) return;
      sending = true;
      button.disabled = true;
      input.disabled = true;
      status.className = '';
      status.textContent = '正在回答…';

      const article = document.createElement('article');
      const heading = document.createElement('h2');
      const steps = document.createElement('div');
      steps.setAttribute('aria-live', 'polite');
      const answer = document.createElement('div');
      heading.textContent = question;
      answer.className = 'answer';
      article.append(heading, steps, answer);
      messages.append(article);
      let reader;
      let finished = false;
      const toolSteps = new Map();

      // 一段完整 SSE 事件可能跨多个网络块；只解析已收完整的事件。
      function handleEvent(frame) {
        const data = frame.split('\n')
          .filter(line => line.startsWith('data:'))
          .map(line => line.slice(5).replace(/^ /, ''))
          .join('\n');
        if (!data) return;
        const event = JSON.parse(data);
        if (event.type === 'session') sessionId = event.session_id;
        else if (event.type === 'tool') {
          const step = document.createElement('p');
          step.className = 'tool-step';
          const args = event.input || {};
          let label = `正在调用工具：${event.name}`;
          if (event.name === 'search_notes') {
            label = `正在搜索笔记${args.query ? `：${args.query}` : ''}`;
            if (args.category) label += `（${args.category}）`;
          } else if (event.name === 'read_note') {
            label = `正在读取笔记${args.source ? `：${args.source}` : ''}`;
          }
          step.textContent = `${steps.childElementCount + 1}. ${label}`;
          toolSteps.set(event.tool_use_id, step);
          steps.append(step);
          status.textContent = label;
        }
        else if (event.type === 'tool_done') {
          const step = toolSteps.get(event.tool_use_id);
          const label = event.is_error ? '工具执行失败' :
            event.name === 'search_notes' ? '笔记搜索完成' :
            event.name === 'read_note' ? '笔记读取完成' : '工具执行完成';
          if (step) {
            step.textContent = step.textContent
              .replace('正在搜索笔记', label)
              .replace('正在读取笔记', label)
              .replace('正在调用工具', label);
          }
          status.textContent = event.is_error ? label : `${label}，正在继续回答…`;
        }
        else if (event.type === 'text') answer.textContent += event.delta;
        else if (event.type === 'done') {
          answer.textContent = event.answer;
          finished = true;
        } else if (event.type === 'error') {
          throw new Error(event.message || '回答失败，请稍后重试');
        }
      }

      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, session_id: sessionId }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          if (response.status === 404) sessionId = null;
          const detail = body.detail;
          throw new Error(typeof detail === 'string' ? detail : detail?.message || `请求失败（${response.status}）`);
        }
        if (!response.body) throw new Error('浏览器未提供响应流');
        reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
          buffer = buffer.replace(/\r\n/g, '\n');
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const frame = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            handleEvent(frame);
          }
          if (done) break;
        }
        if (!finished) throw new Error('连接提前结束，回答可能不完整，请重试');
        input.value = '';
        status.textContent = '回答完成，可以继续追问。';
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message || '请求失败，请检查网络';
      } finally {
        if (reader) {
          await reader.cancel().catch(() => {});
          reader.releaseLock();
        }
        sending = false;
        button.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
